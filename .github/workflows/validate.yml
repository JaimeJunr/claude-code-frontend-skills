name: Validate

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR or branch cancels the run it made obsolete.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # gitleaks lists the commits of the PR

env:
  # Pinned: an unpinned CLI can break, or loosen, the gate with no change here.
  CLAUDE_CODE_VERSION: "2.1.323"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the commits of the push or PR

      # Cheapest first: a leaked secret fails before anything is installed.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action defaults to 8.24.3, which ignores the [[allowlists]]
          # syntax of .gitleaks.toml (added in 8.25.0). Keep in step with local.
          GITLEAKS_VERSION: "8.30.1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Check stack
        run: python3 scripts/sync.py --check

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: Trigger eval is current and passing
        run: python3 scripts/trigger_eval.py --check

      - name: Token budget of hand-written plugins
        run: |
          pip install -r requirements-dev.txt
          python3 scripts/token_budget.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate marketplace and plugins
        run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done

      - name: Install every plugin from this checkout
        run: sh scripts/install_smoke.sh "$PWD"

  # A merge to main is the deploy: users install from main. This proves that
  # what they get is this commit and that it installs.
  deployed:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install every plugin from the published marketplace
        run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          sh scripts/install_smoke.sh "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
